# Baseline configuration for the LE Audio unicast server (headset) role.
# BT Audio/ISO/ASCS options are modeled on
# zephyr/samples/bluetooth/unicast_audio_server's prj.conf - this gets the
# device advertising and accepting an ASE. LC3 codec and I2S audio output
# are added separately alongside the code that uses them.

CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_REBOOT=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="BLE-Audio"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_EXT_ADV=y

# LE Audio unicast server (headset)
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_ASE_SNK_COUNT=2
CONFIG_BT_ASCS_ASE_SRC_COUNT=1
CONFIG_BT_ISO_TX_BUF_COUNT=2
# Support an ISO channel per ASE
CONFIG_BT_ISO_MAX_CHAN=4
# Mandatory to support at least 1 for ASCS
CONFIG_BT_ATT_PREPARE_COUNT=1

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
