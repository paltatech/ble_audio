# codec_handler wraps liblc3, which depends on FPU. Both are available on
# native_sim (confirmed against zephyr/samples/bluetooth/unicast_audio_server's
# own boards/native_sim.conf overlay, which does the same).
CONFIG_FPU=y
CONFIG_LIBLC3=y

CONFIG_ZTEST=y

# LC3's real stack footprint is substantial (Nordic's own sw_codec_lc3
# test needs CONFIG_MAIN_STACK_SIZE=80000 for the same reason). The
# default ZTEST_STACK_SIZE (1024 on non-x86) overflows on 32-bit targets
# during PLC - caught by running this suite under QEMU (mps3/an547).
CONFIG_ZTEST_STACK_SIZE=8192
