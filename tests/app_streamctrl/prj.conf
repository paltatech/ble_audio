CONFIG_ZTEST=y

# Shuffle test/suite order and repeat 3x (Kconfig default) - a suite that
# depends on run order or leaks state between iterations should fail here
# even if it passes in a single fixed-order run.
CONFIG_ZTEST_SHUFFLE=y

# ztress: stresses stream_recv (BT RX path) running concurrently with
# button presses (GPIO IRQ/workqueue path) - two contexts that genuinely
# can interleave on real hardware, unlike two concurrent stream_recv
# calls, which the BLE stack never produces.
CONFIG_ZTRESS=y
CONFIG_TEST_EXTRA_STACK_SIZE=2048
