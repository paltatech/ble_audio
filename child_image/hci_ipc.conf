# Network-core (hci_ipc) Kconfig fragment, picked up automatically by
# NCS's child-image build (nrf/cmake/multi_image.cmake) - no --sysbuild
# needed, this file just has to exist at this path.
#
# Real bug this fixes: the DEFAULT hci_ipc sample (zephyr/samples/
# bluetooth/hci_ipc/prj.conf) enables no ISO or LE Extended Advertising
# support in the controller at all. Our app-core prj.conf enables
# CONFIG_BT_ISO_PERIPHERAL/CONFIG_BT_EXT_ADV on the HOST side, but the
# controller is a SEPARATE build (this child image) with its own
# Kconfig - it doesn't inherit the app core's prj.conf. Without this
# file, bt_enable() succeeds but everything past it fails on real
# hardware: `bt_ascs: Failed to register ISO server -134` (-ENOTSUP -
# controller has no ISO support), then `opcode 0x2036 status 0x01`
# (LE_Set_Extended_Advertising_Parameters - "Unknown HCI Command", no
# extended-adv support either), which aborts
# ble_audio_handler_start() and app_streamctrl_start() with it -
# advertising never starts, confirmed on a real nRF5340 DK.
#
# The controller here is Nordic's SoftDevice Controller (SDC), not
# Zephyr's own open-source split link layer - confirmed by reading the
# real .config from a local build
# (_build_ble_audio_nrf5340dk_nrf5340_cpuapp/hci_ipc/zephyr/.config):
# CONFIG_BT_LL_SOFTDEVICE=y. Zephyr's own upstream reference fragment
# for this exact role (zephyr/samples/bluetooth/hci_ipc/
# nrf5340_cpunet_iso_peripheral-bt_ll_sw_split.conf) targets the split
# link layer instead and forces CONFIG_BT_LL_SW_SPLIT=y, which would
# have fought the already-selected SDC - not used here for that reason.
# CONFIG_BT_CTLR_ADV_EXT/CONFIG_BT_CTLR_PERIPHERAL_ISO are defined once
# in zephyr/subsys/bluetooth/controller/Kconfig regardless of backend
# (each `default y if BT_EXT_ADV` / `default y if BT_ISO_PERIPHERAL`),
# gated by _SUPPORT symbols SDC already selects
# (CONFIG_BT_CTLR_ADV_EXT_SUPPORT/CONFIG_BT_CTLR_PERIPHERAL_ISO_SUPPORT
# were both already =y in the real .config) - so only the host-facing
# symbols below are needed; set explicitly rather than relying on the
# defaults for clarity. CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT is
# SDC-specific sizing (nrf/subsys/bluetooth/controller/Kconfig).

CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n

CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y

CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_CTLR_PERIPHERAL_ISO=y
# Matches this app's own CONFIG_BT_ISO_MAX_CHAN=1 (one ASE)
CONFIG_BT_ISO_MAX_CHAN=1

# Single-connection headset - no need to provision for more
CONFIG_BT_MAX_CONN=1
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=1
